<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่ภาพผลไม้</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', 'Tahoma', sans-serif;
        }

        body {
            background-color: #cbe0ee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .screen {
            width: fit-content;
            background-color: #cbe0ee;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* หน้า Splash Screen */
        #splash-screen {
            width: 390px;
            height: 700px;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .circle-placeholder {
            width: 100px;
            height: 100px;
            background-color: #fffde7;
            border-radius: 50%;
        }

        .btn-main {
            background-color: #4a332d;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-main:focus, .btn-main:hover {
            outline: 4px solid #ff9800;
            outline-offset: 2px;
        }

        /* หน้า Match Screen */
        #match-screen {
            display: none;
            position: relative;
            padding: 10px;
        }

        /* เลย์เอาต์ตามอัตราส่วน Figma */
        .game-grid {
            display: flex;
            gap: 16px;
            align-items: start;
        }

        .images-column {
            display: grid;
            grid-template-columns: repeat(2, 114px);
            gap: 10px;
        }

        .words-column {
            display: flex;
            flex-direction: column;
            width: 114px;
            gap: 13.33px;
        }

        /* ปุ่มรูปภาพ (ขนาด 114x114 px ตาม Figma) */
        .img-card {
            width: 114px;
            height: 114px;
            padding: 8px;
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* ปุ่มบัตรคำ (ขนาด 114x45 px ตาม Figma) */
        .word-card {
            width: 114px;
            height: 45px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
        }

        /* ปุ่มพื้นฐาน */
        .card-btn {
            background: white;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
        }

        .card-btn:focus {
            outline: 4px solid #0056b3;
            outline-offset: 2px;
        }

        /* สถานะเมื่อกดปุ่ม */
        .card-btn.selected {
            border: 3px solid #2196F3 !important;
            background-color: #e3f2fd;
        }

        .card-btn.correct {
            border: 3px solid #4CAF50 !important;
            background-color: #e8f5e9;
            cursor: default;
        }

        .card-btn.wrong {
            border: 3px solid #F44336 !important;
            background-color: #ffebee;
        }

        /* ปุ่มย้อนกลับมุมขวาล่าง */
        .btn-back {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #4a332d;
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 99;
        }

        .btn-back:focus {
            outline: 4px solid #ff9800;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- สื่อสารกับ Screen Reader -->
    <div id="sr-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <!-- หน้า Splash Screen -->
    <div class="screen" id="splash-screen">
        <div class="circle-placeholder"></div>
        <button class="btn-main" onclick="startGame()" aria-label="เริ่มต้นเกม จับคู่ภาพ">จับคู่ภาพ</button>
    </div>

    <!-- หน้า Match Screen -->
    <div class="screen" id="match-screen">
        <div class="game-grid">
            <div class="images-column" id="images-container"></div>
            <div class="words-column" id="words-container"></div>
        </div>
        <button class="btn-back" onclick="goBack()" aria-label="ย้อนกลับไปหน้าหลัก">↩</button>
    </div>

    <script>
        const fruits = [
            { id: 'watermelon', name: 'แตงโม', img: 'pic/แตงโม.jpg' },
            { id: 'passionfruit', name: 'เสาวรส', img: 'pic/เสาวรส.jpg' },
            { id: 'blueberry', name: 'บลูเบอร์รี่', img: 'pic/บลูเบอร์รี่.jpg' },
            { id: 'strawberry', name: 'สตรอว์เบอร์รี่', img: 'pic/สตรอว์เบอร์รี่.jpg' },
            { id: 'longan', name: 'ลำไย', img: 'pic/ลำไย.jpg' },
            { id: 'mangosteen', name: 'มังคุด', img: 'pic/มังคุด.jpg' },
            { id: 'kiwi', name: 'กีวี่', img: 'pic/กีวี่.jpg' },
            { id: 'lychee', name: 'ลิ้นจี่', img: 'pic/ลิ้นจี่.jpg' },
            { id: 'dragonfruit', name: 'แก้วมังกร', img: 'pic/แก้วมังกร.jpg' },
            { id: 'roseapple', name: 'ชมพู่', img: 'pic/ชมพู่.jpg' }
        ];

        let selectedImageId = null;
        let selectedWordId = null;
        let selectedImageBtn = null;
        let selectedWordBtn = null;
        let lockBoard = false;

        const announcer = document.getElementById('sr-announcer');

        // ฟังก์ชันสั่งให้อ่านออกเสียง โดยต่อคิวการพูดตามลำดับ
        function speak(text, clearQueue = false) {
            if (announcer) {
                announcer.textContent = text;
                setTimeout(() => { announcer.textContent = ''; }, 3000);
            }

            if ('speechSynthesis' in window) {
                if (clearQueue) {
                    window.speechSynthesis.cancel(); // ล้างคิวกรณีเปลี่ยนหน้า/กดย้อนกลับเท่านั้น
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startGame() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('match-screen').style.display = 'block';
            speak("เริ่มเกมจับคู่ภาพผลไม้", true);
            renderGame();

            setTimeout(() => {
                const firstBtn = document.querySelector('.card-btn');
                if (firstBtn) firstBtn.focus();
            }, 100);
        }

        function goBack() {
            document.getElementById('match-screen').style.display = 'none';
            document.getElementById('splash-screen').style.display = 'flex';
            speak("กลับสู่หน้าเริ่มต้น", true);
            resetSelection();
        }

        function renderGame() {
            const imagesContainer = document.getElementById('images-container');
            const wordsContainer = document.getElementById('words-container');
            
            imagesContainer.innerHTML = '';
            wordsContainer.innerHTML = '';

            fruits.forEach(fruit => {
                const imgBtn = document.createElement('button');
                imgBtn.className = 'card-btn img-card';
                imgBtn.setAttribute('aria-label', 'รูป ' + fruit.name);
                imgBtn.innerHTML = `<img src="${fruit.img}" alt="รูป ${fruit.name}">`;
                imgBtn.onclick = () => handleSelect('image', fruit.id, imgBtn);
                imagesContainer.appendChild(imgBtn);

                const wordBtn = document.createElement('button');
                wordBtn.className = 'card-btn word-card';
                wordBtn.setAttribute('aria-label', 'บัตรคำ ' + fruit.name);
                wordBtn.innerText = fruit.name;
                wordBtn.onclick = () => handleSelect('word', fruit.id, wordBtn);
                wordsContainer.appendChild(wordBtn);
            });
        }

        function handleSelect(type, id, btnElement) {
            if (lockBoard) return;
            if (btnElement.classList.contains('correct')) return;

            const item = fruits.find(f => f.id === id);

            if (type === 'image') {
                if (selectedImageBtn) selectedImageBtn.classList.remove('selected');
                selectedImageId = id;
                selectedImageBtn = btnElement;
                selectedImageBtn.classList.add('selected');
                if (item) speak("เลือกรูป " + item.name, true);
            } else if (type === 'word') {
                if (selectedWordBtn) selectedWordBtn.classList.remove('selected');
                selectedWordId = id;
                selectedWordBtn = btnElement;
                selectedWordBtn.classList.add('selected');
                if (item) speak("เลือกบัตรคำ " + item.name, true);
            }

            // ถ้าเลือกครบสองฝั่งแล้ว
            if (selectedImageId && selectedWordId) {
                lockBoard = true;
                // รอให้อ่าน "เลือกบัตรคำ [ชื่อผลไม้]" จบก่อนประมาณ 1.2 วินาที ค่อยเฉลยถูก/ผิด
                setTimeout(() => {
                    checkMatch();
                }, 1200);
            }
        }

        function checkMatch() {
            const isMatch = (selectedImageId === selectedWordId);

            if (isMatch) {
                speak('จับคู่ถูกต้อง');
                selectedImageBtn.classList.remove('selected');
                selectedWordBtn.classList.remove('selected');

                selectedImageBtn.classList.add('correct');
                selectedWordBtn.classList.add('correct');

                selectedImageBtn.setAttribute('aria-label', selectedImageBtn.getAttribute('aria-label') + ' จับคู่ถูกต้องแล้ว');
                selectedWordBtn.setAttribute('aria-label', selectedWordBtn.getAttribute('aria-label') + ' จับคู่ถูกต้องแล้ว');

                resetSelection();
            } else {
                speak('จับคู่ผิด ลองใหม่นะ');
                selectedImageBtn.classList.add('wrong');
                selectedWordBtn.classList.add('wrong');

                setTimeout(() => {
                    selectedImageBtn.classList.remove('selected', 'wrong');
                    selectedWordBtn.classList.remove('selected', 'wrong');
                    resetSelection();
                }, 1500);
            }
        }

        function resetSelection() {
            selectedImageId = null;
            selectedWordId = null;
            selectedImageBtn = null;
            selectedWordBtn = null;
            lockBoard = false;
        }
    </script>
</body>
</html>

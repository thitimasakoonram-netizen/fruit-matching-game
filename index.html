<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมจับคู่ภาพผลไม้ (Accessible Screen Reader)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', 'Tahoma', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #cbe0ee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            overflow: hidden;
            touch-action: none;
        }

        .screen {
            width: fit-content;
            background-color: #cbe0ee;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* หน้า Splash Screen */
        #splash-screen {
            width: 390px;
            height: 700px;
            justify-content: center;
            align-items: center;
            gap: 40px;
            display: flex;
        }

        .circle-placeholder {
            width: 100px;
            height: 100px;
            background-color: #fffde7;
            border-radius: 50%;
            transition: transform 0.15s ease;
        }

        .circle-placeholder.focused {
            outline: 6px solid #ff9800 !important;
            outline-offset: 4px;
            transform: scale(1.08);
        }

        .btn-main {
            background-color: #4a332d;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.15s ease;
        }

        .btn-main.focused {
            outline: 6px solid #ff9800 !important;
            outline-offset: 4px;
            transform: scale(1.05);
        }

        /* หน้า Match Screen */
        #match-screen {
            display: none;
            position: relative;
            padding: 10px;
        }

        /* ปุ่มย้อนกลับตาม UI จัดวางด้านบนซ้าย */
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .btn-back {
            background-color: #ff5722;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 8px;
            width: fit-content;
            transition: all 0.15s ease;
        }

        .btn-back.focused {
            outline: 6px solid #ff9800 !important;
            outline-offset: 2px;
            transform: scale(1.05);
        }

        .game-grid {
            display: flex;
            gap: 16px;
            align-items: start;
        }

        .images-column {
            display: grid;
            grid-template-columns: repeat(2, 114px);
            gap: 10px;
        }

        .words-column {
            display: flex;
            flex-direction: column;
            width: 114px;
            gap: 13.33px;
        }

        .img-card {
            width: 114px;
            height: 114px;
            padding: 8px;
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .word-card {
            width: 114px;
            height: 45px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
        }

        .card-btn {
            background: white;
            border: 2px solid transparent;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
            pointer-events: none;
        }

        .card-btn.focused {
            outline: 6px solid #ff9800 !important;
            outline-offset: 2px;
            transform: scale(1.05);
        }

        .card-btn.selected {
            border: 4px solid #2196F3 !important;
            background-color: #e3f2fd;
        }

        .card-btn.correct {
            border: 4px solid #4CAF50 !important;
            background-color: #e8f5e9;
            opacity: 0.6;
        }

        .card-btn.wrong {
            border: 4px solid #F44336 !important;
            background-color: #ffebee;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>

    <div id="sr-announcer" class="sr-only" aria-live="assertive"></div>

    <!-- หน้า Splash Screen -->
    <div class="screen" id="splash-screen">
        <div class="circle-placeholder focused" id="splash-logo"></div>
        <div class="btn-main" id="splash-btn" data-label="เกมจับคู่ภาพ">เกมจับคู่ภาพ</div>
    </div>

    <!-- หน้า Match Screen -->
    <div class="screen" id="match-screen">
        <!-- แถบด้านบนสำหรับปุ่มย้อนกลับ -->
        <div class="header-bar">
            <div class="btn-back card-btn" id="btn-back-nav" data-type="back" data-label="ย้อนกลับ">⬅️ ย้อนกลับ</div>
        </div>

        <div class="game-grid">
            <div class="images-column" id="images-container"></div>
            <div class="words-column" id="words-container"></div>
        </div>
    </div>

    <script>
        const fruits = [
            { id: 'watermelon', name: 'แตงโม', img: 'pic/แตงโม.jpg' },
            { id: 'passionfruit', name: 'เสาวรส', img: 'pic/เสาวรส.jpg' },
            { id: 'blueberry', name: 'บลูเบอร์รี่', img: 'pic/บลูเบอร์รี่.jpg' },
            { id: 'strawberry', name: 'สตรอว์เบอร์รี่', img: 'pic/สตรอว์เบอร์รี่.jpg' },
            { id: 'longan', name: 'ลำไย', img: 'pic/ลำไย.jpg' },
            { id: 'mangosteen', name: 'มังคุด', img: 'pic/มังคุด.jpg' },
            { id: 'kiwi', name: 'กีวี่', img: 'pic/กีวี่.jpg' },
            { id: 'lychee', name: 'ลิ้นจี่', img: 'pic/ลิ้นจี่.jpg' },
            { id: 'dragonfruit', name: 'แก้วมังกร', img: 'pic/แก้วมังกร.jpg' },
            { id: 'roseapple', name: 'ชมพู่', img: 'pic/ชมพู่.jpg' }
        ];

        let focusableElements = [];
        let currentIndex = 0;

        let splashElements = [];
        let splashIndex = 0;

        let selectedImageId = null;
        let selectedWordId = null;
        let selectedImageBtn = null;
        let selectedWordBtn = null;
        let lockBoard = false;
        let gameStarted = false;

        const announcer = document.getElementById('sr-announcer');

        function speak(text, clear = true) {
            if (!text) return;
            if (announcer) {
                announcer.textContent = text;
            }
            if ('speechSynthesis' in window) {
                if (clear) window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- ระบบจัดการหน้าแรก (Splash Screen) ---
        const splashLogo = document.getElementById('splash-logo');
        const splashBtn = document.getElementById('splash-btn');
        splashElements = [splashLogo, splashBtn];

        function updateSplashFocus() {
            splashElements.forEach((el, idx) => {
                if (idx === splashIndex) {
                    el.classList.add('focused');
                    if (el === splashBtn) {
                        speak(el.dataset.label);
                    }
                } else {
                    el.classList.remove('focused');
                }
            });
        }

        // --- ระบบเกม (Match Screen) ---
        function renderGame() {
            const imagesContainer = document.getElementById('images-container');
            const wordsContainer = document.getElementById('words-container');
            const btnBackNav = document.getElementById('btn-back-nav');
            
            imagesContainer.innerHTML = '';
            wordsContainer.innerHTML = '';
            focusableElements = [];

            // 1. ใส่รูปภาพทั้ง 10 รูปก่อน (เริ่มอ่านที่รูปแรก)
            fruits.forEach(fruit => {
                const imgBtn = document.createElement('div');
                imgBtn.className = 'card-btn img-card';
                imgBtn.dataset.type = 'image';
                imgBtn.dataset.id = fruit.id;
                imgBtn.dataset.name = fruit.name;
                imgBtn.dataset.label = 'รูป ' + fruit.name;
                imgBtn.innerHTML = `<img src="${fruit.img}" alt="${fruit.name}">`;
                imagesContainer.appendChild(imgBtn);
                focusableElements.push(imgBtn);
            });

            // 2. ใส่บัตรคำทั้ง 10 คำ
            fruits.forEach(fruit => {
                const wordBtn = document.createElement('div');
                wordBtn.className = 'card-btn word-card';
                wordBtn.dataset.type = 'word';
                wordBtn.dataset.id = fruit.id;
                wordBtn.dataset.name = fruit.name;
                wordBtn.dataset.label = 'บัตรคำ ' + fruit.name;
                wordBtn.innerText = fruit.name;
                wordsContainer.appendChild(wordBtn);
                focusableElements.push(wordBtn);
            });

            // 3. ใส่ปุ่มย้อนกลับไว้ท้ายสุดของลำดับการปัด (แต่ UI อยู่ซ้ายบน)
            focusableElements.push(btnBackNav);

            currentIndex = 0; // เริ่มต้นที่ รูปที่ 1
            updateFocus();
        }

        function updateFocus() {
            focusableElements.forEach((el, index) => {
                if (index === currentIndex) {
                    el.classList.add('focused');
                    let statusText = el.dataset.label;
                    if (el.classList.contains('correct')) {
                        statusText += ' จับคู่ถูกต้องแล้ว';
                    } else if (el.classList.contains('selected')) {
                        statusText += ' เลือกอยู่';
                    }
                    speak(statusText);
                } else {
                    el.classList.remove('focused');
                }
            });
        }

        function nextItem() {
            if (lockBoard) return;
            if (!gameStarted) {
                if (splashIndex < splashElements.length - 1) {
                    splashIndex++;
                } else {
                    splashIndex = 0;
                }
                updateSplashFocus();
                return;
            }

            if (currentIndex < focusableElements.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // ปัดขวาจนสุดจะวนกลับไปรูปแรก
            }
            updateFocus();
        }

        function prevItem() {
            if (lockBoard) return;
            if (!gameStarted) {
                if (splashIndex > 0) {
                    splashIndex--;
                } else {
                    splashIndex = splashElements.length - 1;
                }
                updateSplashFocus();
                return;
            }

            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = focusableElements.length - 1; // ปัดซ้ายวนไปอันสุดท้าย
            }
            updateFocus();
        }

        function handleTapAction() {
            if (!gameStarted) {
                if (splashElements[splashIndex] === splashBtn) {
                    gameStarted = true;
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('match-screen').style.display = 'block';
                    renderGame();
                }
            } else {
                selectCurrentFocusedItem();
            }
        }

        function selectCurrentFocusedItem() {
            if (lockBoard) return;
            const currentEl = focusableElements[currentIndex];
            if (!currentEl) return;

            // พอกดเลือกปุ่มย้อนกลับ
            if (currentEl.dataset.type === 'back') {
                gameStarted = false;
                splashIndex = 0; // รีเซ็ตไปที่โลโก้
                document.getElementById('match-screen').style.display = 'none';
                document.getElementById('splash-screen').style.display = 'flex';
                updateSplashFocus();
                resetSelection();
                return;
            }

            if (currentEl.classList.contains('correct')) {
                speak(currentEl.dataset.label + ' จับคู่ถูกต้องไปแล้ว');
                return;
            }

            const type = currentEl.dataset.type;
            const id = currentEl.dataset.id;
            const name = currentEl.dataset.name;

            if (type === 'image') {
                if (selectedImageBtn) selectedImageBtn.classList.remove('selected');
                selectedImageId = id;
                selectedImageBtn = currentEl;
                selectedImageBtn.classList.add('selected');
                speak("เลือกรูป " + name);
            } else if (type === 'word') {
                if (selectedWordBtn) selectedWordBtn.classList.remove('selected');
                selectedWordId = id;
                selectedWordBtn = currentEl;
                selectedWordBtn.classList.add('selected');
                speak("เลือกบัตรคำ " + name);
            }

            if (selectedImageId && selectedWordId) {
                lockBoard = true;
                setTimeout(() => {
                    checkMatch();
                }, 1200);
            }
        }

        function checkMatch() {
            const isMatch = (selectedImageId === selectedWordId);

            if (isMatch) {
                speak('จับคู่ถูกต้อง');
                selectedImageBtn.classList.remove('selected');
                selectedWordBtn.classList.remove('selected');

                selectedImageBtn.classList.add('correct');
                selectedWordBtn.classList.add('correct');

                resetSelection();
            } else {
                speak('จับคู่ผิด ลองใหม่นะ');
                selectedImageBtn.classList.add('wrong');
                selectedWordBtn.classList.add('wrong');

                setTimeout(() => {
                    selectedImageBtn.classList.remove('selected', 'wrong');
                    selectedWordBtn.classList.remove('selected', 'wrong');
                    resetSelection();
                }, 1500);
            }
        }

        function resetSelection() {
            selectedImageId = null;
            selectedWordId = null;
            selectedImageBtn = null;
            selectedWordBtn = null;
            lockBoard = false;
        }

        // --- ระบบ Gesture ตรวจจับการปัดและการกด ---
        let startX = 0;
        let startY = 0;
        let isSwiping = false;

        window.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isSwiping = false;
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            if (!startX || !startY) return;

            let diffX = e.touches[0].clientX - startX;
            let diffY = e.touches[0].clientY - startY;

            if (Math.abs(diffX) > 20 || Math.abs(diffY) > 20) {
                isSwiping = true;
            }
        }, { passive: false });

        window.addEventListener('touchend', e => {
            let endX = e.changedTouches[0].clientX;
            let endY = e.changedTouches[0].clientY;

            let diffX = endX - startX;
            let diffY = endY - startY;

            // แก้ไขทิศทาง: ปัดขวา (diffX > 0) = ถัดไป / ปัดซ้าย (diffX < 0) = ย้อนกลับ
            if (Math.abs(diffX) > 30 && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    nextItem();  // ปัดขวา = ถัดไป
                } else {
                    prevItem();  // ปัดซ้าย = ย้อนกลับ
                }
            } 
            else if (!isSwiping && Math.abs(diffX) < 15 && Math.abs(diffY) < 15) {
                handleTapAction();
            }

            startX = 0;
            startY = 0;
            isSwiping = false;
        }, { passive: false });
    </script>
</body>
</html>

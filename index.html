<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่ภาพผลไม้ (Accessible Screen Reader)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', 'Tahoma', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #cbe0ee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            overflow: hidden;
            touch-action: none;
        }

        .screen {
            width: fit-content;
            background-color: #cbe0ee;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* หน้า Splash Screen */
        #splash-screen {
            width: 390px;
            height: 700px;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .circle-placeholder {
            width: 100px;
            height: 100px;
            background-color: #fffde7;
            border-radius: 50%;
        }

        .btn-main {
            background-color: #4a332d;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.15s ease;
        }

        /* กรอบโฟกัสตอนปัดเจอหน้าแรก */
        .btn-main.focused {
            outline: 6px solid #ff9800 !important;
            outline-offset: 2px;
            transform: scale(1.05);
        }

        /* หน้า Match Screen */
        #match-screen {
            display: none;
            position: relative;
            padding: 10px;
        }

        .game-grid {
            display: flex;
            gap: 16px;
            align-items: start;
        }

        .images-column {
            display: grid;
            grid-template-columns: repeat(2, 114px);
            gap: 10px;
        }

        .words-column {
            display: flex;
            flex-direction: column;
            width: 114px;
            gap: 13.33px;
        }

        .img-card {
            width: 114px;
            height: 114px;
            padding: 8px;
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .word-card {
            width: 114px;
            height: 45px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
        }

        .card-btn {
            background: white;
            border: 2px solid transparent;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
            pointer-events: none;
        }

        .card-btn.focused {
            outline: 6px solid #ff9800 !important;
            outline-offset: 2px;
            transform: scale(1.05);
        }

        .card-btn.selected {
            border: 4px solid #2196F3 !important;
            background-color: #e3f2fd;
        }

        .card-btn.correct {
            border: 4px solid #4CAF50 !important;
            background-color: #e8f5e9;
            opacity: 0.6;
        }

        .card-btn.wrong {
            border: 4px solid #F44336 !important;
            background-color: #ffebee;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>

    <div id="sr-announcer" class="sr-only" aria-live="assertive"></div>

    <!-- หน้า Splash Screen -->
    <div class="screen" id="splash-screen">
        <div class="circle-placeholder"></div>
        <div class="btn-main focused" id="splash-btn" data-label="เกมจับคู่ภาพ">เกมจับคู่ภาพ</div>
    </div>

    <!-- หน้า Match Screen -->
    <div class="screen" id="match-screen">
        <div class="game-grid">
            <div class="images-column" id="images-container"></div>
            <div class="words-column" id="words-container"></div>
        </div>
    </div>

    <script>
        const fruits = [
            { id: 'watermelon', name: 'แตงโม', img: 'pic/แตงโม.jpg' },
            { id: 'passionfruit', name: 'เสาวรส', img: 'pic/เสาวรส.jpg' },
            { id: 'blueberry', name: 'บลูเบอร์รี่', img: 'pic/บลูเบอร์รี่.jpg' },
            { id: 'strawberry', name: 'สตรอว์เบอร์รี่', img: 'pic/สตรอว์เบอร์รี่.jpg' },
            { id: 'longan', name: 'ลำไย', img: 'pic/ลำไย.jpg' },
            { id: 'mangosteen', name: 'มังคุด', img: 'pic/มังคุด.jpg' },
            { id: 'kiwi', name: 'กีวี่', img: 'pic/กีวี่.jpg' },
            { id: 'lychee', name: 'ลิ้นจี่', img: 'pic/ลิ้นจี่.jpg' },
            { id: 'dragonfruit', name: 'แก้วมังกร', img: 'pic/แก้วมังกร.jpg' },
            { id: 'roseapple', name: 'ชมพู่', img: 'pic/ชมพู่.jpg' }
        ];

        let focusableElements = [];
        let currentIndex = 0;

        let selectedImageId = null;
        let selectedWordId = null;
        let selectedImageBtn = null;
        let selectedWordBtn = null;
        let lockBoard = false;
        let gameStarted = false;

        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        const announcer = document.getElementById('sr-announcer');

        function speak(text, clear = true) {
            if (announcer) {
                announcer.textContent = text;
            }
            if ('speechSynthesis' in window) {
                if (clear) window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // เริ่มต้นเซ็ตค่าหน้าแรกโดย "ไม่ส่งเสียงใดๆ" ตอนโหลดเว็บ
        const splashBtn = document.getElementById('splash-btn');

        function updateSplashFocus() {
            speak(splashBtn.dataset.label);[cite: 1]
        }

        function renderGame() {
            const imagesContainer = document.getElementById('images-container');
            const wordsContainer = document.getElementById('words-container');
            
            imagesContainer.innerHTML = '';
            wordsContainer.innerHTML = '';
            focusableElements = [];

            fruits.forEach(fruit => {
                const imgBtn = document.createElement('div');
                imgBtn.className = 'card-btn img-card';
                imgBtn.dataset.type = 'image';
                imgBtn.dataset.id = fruit.id;
                imgBtn.dataset.name = fruit.name;
                imgBtn.dataset.label = 'รูป ' + fruit.name;
                imgBtn.innerHTML = `<img src="${fruit.img}" alt="${fruit.name}">`;
                imagesContainer.appendChild(imgBtn);
                focusableElements.push(imgBtn);
            });

            fruits.forEach(fruit => {
                const wordBtn = document.createElement('div');
                wordBtn.className = 'card-btn word-card';
                wordBtn.dataset.type = 'word';
                wordBtn.dataset.id = fruit.id;
                wordBtn.dataset.name = fruit.name;
                wordBtn.dataset.label = 'บัตรคำ ' + fruit.name;
                wordBtn.innerText = fruit.name;
                wordsContainer.appendChild(wordBtn);
                focusableElements.push(wordBtn);
            });

            currentIndex = 0;
            updateFocus();
        }

        function updateFocus() {
            focusableElements.forEach((el, index) => {
                if (index === currentIndex) {
                    el.classList.add('focused');
                    let statusText = el.dataset.label;
                    if (el.classList.contains('correct')) {
                        statusText += ' จับคู่ถูกต้องแล้ว';
                    } else if (el.classList.contains('selected')) {
                        statusText += ' เลือกอยู่';
                    }
                    speak(statusText);[cite: 1]
                } else {
                    el.classList.remove('focused');
                }
            });
        }

        function nextItem() {
            if (lockBoard) return;
            if (!gameStarted) return; // หน้าแรกมีปุ่มเดียว ไม่ต้องเลื่อน
            if (currentIndex < focusableElements.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            updateFocus();
        }

        function prevItem() {
            if (lockBoard) return;
            if (!gameStarted) return; // หน้าแรกมีปุ่มเดียว ไม่ต้องเลื่อน
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = focusableElements.length - 1;
            }
            updateFocus();
        }

        function handleMainClick() {
            if (!gameStarted) {
                gameStarted = true;
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('match-screen').style.display = 'block';
                renderGame();
            } else {
                selectCurrentFocusedItem();[cite: 1]
            }
        }

        function selectCurrentFocusedItem() {
            if (lockBoard) return;
            const currentEl = focusableElements[currentIndex];
            if (!currentEl) return;

            if (currentEl.classList.contains('correct')) {
                speak(currentEl.dataset.label + ' จับคู่ถูกต้องไปแล้ว');[cite: 1]
                return;
            }

            const type = currentEl.dataset.type;
            const id = currentEl.dataset.id;
            const name = currentEl.dataset.name;

            if (type === 'image') {
                if (selectedImageBtn) selectedImageBtn.classList.remove('selected');
                selectedImageId = id;
                selectedImageBtn = currentEl;
                selectedImageBtn.classList.add('selected');
                speak("เลือกรูป " + name);[cite: 1]
            } else if (type === 'word') {
                if (selectedWordBtn) selectedWordBtn.classList.remove('selected');
                selectedWordId = id;
                selectedWordBtn = currentEl;
                selectedWordBtn.classList.add('selected');
                speak("เลือกบัตรคำ " + name);[cite: 1]
            }

            if (selectedImageId && selectedWordId) {
                lockBoard = true;
                setTimeout(() => {
                    checkMatch();
                }, 1200);
            }
        }

        function checkMatch() {
            const isMatch = (selectedImageId === selectedWordId);

            if (isMatch) {
                speak('จับคู่ถูกต้อง');[cite: 1]
                selectedImageBtn.classList.remove('selected');
                selectedWordBtn.classList.remove('selected');

                selectedImageBtn.classList.add('correct');
                selectedWordBtn.classList.add('correct');

                resetSelection();
            } else {
                speak('จับคู่ผิด ลองใหม่นะ');[cite: 1]
                selectedImageBtn.classList.add('wrong');
                selectedWordBtn.classList.add('wrong');

                setTimeout(() => {
                    selectedImageBtn.classList.remove('selected', 'wrong');
                    selectedWordBtn.classList.remove('selected', 'wrong');
                    resetSelection();
                }, 1500);
            }
        }

        function resetSelection() {
            selectedImageId = null;
            selectedWordId = null;
            selectedImageBtn = null;
            selectedWordBtn = null;
            lockBoard = false;
        }

        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleGesture();
        }, { passive: true });

        function handleGesture() {
            const xDiff = touchEndX - touchStartX;
            const yDiff = touchEndY - touchStartY;

            if (Math.abs(xDiff) > 40 && Math.abs(xDiff) > Math.abs(yDiff)) {
                if (!gameStarted) {
                    // อยู่หน้าแรก ปัดแล้วให้อ่าน "เกมจับคู่ภาพ"
                    updateSplashFocus();[cite: 1]
                    return;
                }
                if (xDiff < 0) {
                    nextItem();[cite: 1]
                } else {
                    prevItem();[cite: 1]
                }
            } 
            else if (Math.abs(xDiff) < 15 && Math.abs(yDiff) < 15) {
                handleMainClick();[cite: 1]
            }
        }
    </script>
</body>
</html>
